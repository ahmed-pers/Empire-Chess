<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EmpireChess - Lobbies</title>
  <link rel="stylesheet" href="lobby.css">
</head>
<body>

    <audio id="bg-music" loop></audio>
    <audio id="quote-audio"></audio>
    <audio id="start-audio" src="assets/music/start.mp3"></audio>

    <div id="intro-overlay">
        <p id="intro-matchup"></p>
        <h1>The Battle Begins</h1>
        <div class="divider"></div>
        <p id="intro-count"></p>
    </div>

    <header>
        <div class="logo">
            <img src="assets/images/logo/logo.png" alt="logo">
        </div>

        <div class="header-buttons">
            <div class="button">
                <a href="home.html">
                    <button class="home-button"></button>
                </a>
                <p>Home</p>
            </div>
            <div class="button">
                <a href="empire_select.html">
                    <button class="empire-button"></button>
                </a>
                <p>Empire</p>
            </div>
            <div class="button">
                <a href="puzzle.html">
                    <button class="puzzle-button"></button>
                </a>
                <p>Puzzles</p>
            </div>
            <div class="button">
                <a href="stats.html">
                    <button class="stats-button"></button>
                </a>
                <p>Stats</p>
            </div>
        </div>

        <div class="profile">
            <img src="assets/images/avatars/avatar-sultan.png" alt="proile image" style="width: 50px; height:50px;">
            <span>
                <p>Sultan_82</p>
                <p>Empire Elite</p>
            </span>
            <img src="assets/images/icons/chevron-down.png" alt="down arrow" style="width: 18px; height: 15px;">
        </div>
    </header>


  <main class="lobby">
    <h1>Game Lobbies</h1>

    <div class="lobby-create">
      <input id="lobby-name" placeholder="Lobby name">
      <button id="lobby-create">Create lobby</button>
      <button id="lobby-cancel" hidden>Cancel</button>
    </div>
    <p id="lobby-status"></p>

    <ul id="lobby-list"></ul>
    <p id="lobby-empty">No lobbies yet. Create one!</p>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="lobby.js"></script>
</body>
</html>
