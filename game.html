<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empire Chess</title>
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <audio src="assets/music/quote-ottoman.mp3" id="quote-audio"></audio>
    <audio src="assets/music/start.mp3" id="start-audio"></audio>

    <div id="intro-overlay">
        <p id="intro-matchup"></p>
        <h1>The Battle Begins</h1>
        <div class="divider"></div>
        <p id="intro-count"></p>
    </div>

    <div id="fade-in"></div>
    <header>
        <div class="logo">
            <img src="assets/images/logo/logo.png" alt="logo">
        </div>

        <div class="header-buttons">
            <div class="button">
                <a href="home.html">
                    <button class="home-button"></button>
                </a>
                <p>Home</p>
            </div>
            <div class="button">
                <a href="empire_list.html">
                    <button class="empire-button"></button>
                </a>
                <p>Empires</p>
            </div>
            <div class="button">
                <a href="puzzle.html">
                    <button class="puzzle-button"></button>
                </a>
                <p>Puzzles</p>
            </div>
            <div class="button">
                <a href="stats.html">
                    <button class="stats-button"></button>
                </a>
                <p>Stats</p>
            </div>
        </div>

        <div class="profile">
            <img id="header-profile-avatar" src="assets/images/avatars/avatar-sultan.png" alt="profile image" style="width: 50px; height:50px;">
            <span>
                <p>Sultan_82</p>
                <p>Empire Elite</p>
            </span>
            <img src="assets/images/icons/chevron-down.png" alt="down arrow" style="width: 18px; height: 15px;">
        </div>
    </header>
    

    <main>
        <section class="sidebar-left">
            <div class="opponent-card">
                <img id="opponent-flag" src="assets/images/flags/carthaginian_flag.png" alt="opponent flag" class="flag">
                <div class="name-banner">
                    <img src="assets/images/avatars/avatar-carthage.png" alt="player pic">
                    <span>
                        <p class="timer">10:00</p>
                        <p>Punic-guy</p>
                    </span>
                </div>
            </div>
            <div class="player-card">
                <img id="player-flag" src="assets/images/flags/ottoman_flag.png" alt="player flag" class="flag">
                <div class="name-banner">
                    <img id="player-banner-avatar" src="assets/images/avatars/avatar-sultan.png" alt="player pic">
                    <span>
                        <p class="timer">10:00</p>
                        <p>Sultan_82</p>
                    </span>
                </div> 
            </div> 
        </section>
        <section class="content-center">
            <img id="game-board" src="assets/images/board/board.png" alt="board">
        </section>
        <section class="sidebar-right">
            <div class="move-history">
                <p class="move-history-title">Move history</p>
                <span class="move-history-columns">
                    <p>black</p>
                    <p>white</p>
                </span>
                <span class="move-history-details">
                    <ul>
                        <li>e4</li>
                        <li>Nf3</li>
                        <li>Bb5</li>
                        <li>Ba4</li>
                    </ul>
                    <ul>
                        <li>b5</li>
                        <li>Nc6</li>
                        <li>a6</li>
                    </ul>
                </span>
            </div>
            <div class="ingame-buttons">
                <div class="button">
                    <button id="drawBtn"></button>
                    <p>Draw</p>
                </div>
                <div class="button">
                    <button id="resignBtn"></button>
                    <p>Resign</p>
                </div>
            </div>
            <img src="assets/images/logo/crescent-laurel-full.png" alt="emblem" class="emblem">
        </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="game_online.js"></script>
    <script src="script.js"></script>
</body>
</html>
