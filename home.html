<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empire Chess</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>
    
    <audio src="assets/music/ottoman.mp3" autoplay loop id="bg-music"></audio>

    <!-- Splash Screen / Enter Overlay -->
    <div id="start-overlay" class="overlay">
        <div class="overlay-content">
            <!-- Logo instead of text title -->
            <img src="assets/images/logo/logo.png" alt="Empire Chess Logo" class="overlay-logo">
            
            <p>Press any key to enter</p>
        </div>
    </div>

    <header>
        <div class="logo">
            <img src="assets/images/logo/logo.png" alt="logo">
        </div>

        <div class="header-buttons">
            <div class="button clicked">
                <a href="home.html">
                    <button class="home-button"></button>
                </a>
                <p>Home</p>
            </div>
            <div class="button">
                <a href="empire_select.html">
                    <button class="empire-button"></button>
                </a>
                <p>Empire</p>
            </div>
            <div class="button">
                <a href="puzzle.html">
                    <button class="puzzle-button"></button>
                </a>
                <p>Puzzles</p>
            </div>
            <div class="button">
                <a href="stats.html">
                    <button class="stats-button"></button>
                </a>
                <p>Stats</p>
            </div>
        </div>

        <div class="profile">
            <img src="assets/images/avatars/avatar-sultan.png" alt="proile image" style="width: 50px; height:50px;">
            <span>
                <p>Sultan_82</p>
                <p>Empire Elite</p>
            </span>
            <img src="assets/images/icons/chevron-down.png" alt="down arrow" style="width: 18px; height: 15px;">
        </div>
    </header>

    <main>
        <div class="home-buttons">
            <a href="empire_select.html">
                <button class="menu-btn primary">Play</button>
            </a>
            <a href="empire_list.html">
                <button class="menu-btn">Empire</button>
            </a>
            <a href="puzzles.html">
                <button class="menu-btn">Puzzles</button>
            </a>
            <a href="stats.html">
                <button class="menu-btn">Stats</button>
            </a>
        </div>
        <div class="cover"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
